<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registrasi Manual Hari-H (OTS) | STANDING FIRM Petra</title>
  <meta name="description" content="Form pendaftaran cepat di meja registrasi Hari-H untuk peserta On-The-Spot (Walk-In) Standing Firm Petra.">
  
  <!-- Favicon / Web App Icon -->
  <link rel="icon" type="image/png" href="assets/iconsf.png">
  <link rel="apple-touch-icon" href="assets/iconsf.png">
  
  <!-- CSS Stylesheet & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="manual-page-body">

  <!-- Ambient Light Layer & Particle Canvas -->
  <div class="bg-ambient-layer"></div>
  <canvas id="particle-canvas"></canvas>

  <div class="manual-app-wrapper">
    
    <main class="manual-main-content">
      
      <!-- Event Closed Card -->
      <section class="manual-form-card" style="text-align: center;">
        
        <div class="manual-form-header">
          <p class="hero-subtitle" style="color: var(--color-navy-dim); margin-bottom: 6px; font-size: 0.75rem;">Young Christian People Fellowship</p>
          <h1 class="manual-form-title">STANDING FIRM</h1>
        </div>

        <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(76, 175, 80, 0.15); border: 1px solid #81c784; color: #2e7d32; padding: 6px 14px; border-radius: var(--radius-pill); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;">
          <i class="bi bi-check-circle-fill"></i> Pendaftaran Telah Ditutup
        </div>

        <h2 style="font-family: var(--font-serif); font-size: 1.35rem; color: var(--color-navy); font-weight: 700; margin-bottom: 10px;">
          Acara Telah Selesai
        </h2>

        <p style="font-size: 0.88rem; color: var(--color-navy-dim); line-height: 1.6; margin-bottom: 24px;">
          Pendaftaran kehadiran manual untuk acara Standing Firm Welcome Gathering telah ditutup. Terima kasih kepada seluruh peserta yang telah hadir!
        </p>

        <a 
          href="https://instagram.com/stayatzion" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="cta-btn-primary"
          style="text-decoration: none;"
        >
          <i class="bi bi-instagram"></i>
          <span>Kunjungi Instagram @stayatzion</span>
          <i class="bi bi-arrow-up-right"></i>
        </a>

      </section>

    </main>

  </div>

  <!-- Toast Alert -->
  <div class="toast-alert" id="toast-alert">
    <span id="toast-icon">✅</span>
    <span id="toast-message">Pesan notifikasi</span>
  </div>

  <!-- Logic Script -->
  <script type="module" src="manual.js"></script>
</body>
</html>
